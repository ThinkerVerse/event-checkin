<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Check-In Kiosk</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-large {
            min-height: 3.5rem;
            font-size: 1.25rem;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        /* Overlay loading indicator */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .loading-text {
            background: white;
            padding: 2rem;
            border-radius: 0.5rem;
            font-size: 1.25rem;
            font-weight: 600;
            color: #1f2937;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Loading Overlay (only shows when actually loading) -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-text">Loading...</div>
    </div>

    <div class="container mx-auto px-4 py-8 max-w-md">
        <div class="bg-white rounded-lg shadow-md p-6">
            <h1 class="text-2xl font-bold text-center mb-6">Event Check-In</h1>
            
            <div id="app">
                <!-- Search interface -->
                <div id="search-container" style="display: none;">
                    <div class="relative mb-6">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </div>
                        <input 
                            type="text" 
                            id="search-input"
                            placeholder="Search for guest name..." 
                            class="pl-10 p-4 w-full border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 text-lg"
                            autocomplete="off"
                        >
                    </div>
                    
                    <div id="results-container" class="border border-gray-200 rounded-lg overflow-hidden" style="display: none;"></div>
                    
                    <div id="no-results" class="text-center p-4 text-gray-500" style="display: none;">
                        No matching guests found
                    </div>
                </div>
                
                <!-- Guest details view -->
                <div id="guest-details" style="display: none;">
                    <div class="mb-4 p-4 bg-gray-50 rounded-lg">
                        <h2 id="guest-name" class="text-xl font-semibold mb-2"></h2>
                        <p class="text-gray-700 mb-1"><span class="font-medium">Table:</span> <span id="guest-table"></span></p>
                        <p class="text-gray-700 mb-4"><span class="font-medium">Seat:</span> <span id="guest-seat"></span></p>
                        
                        <div id="already-checked-in" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" style="display: none;">
                            <strong>Checked In!</strong> Guest has already been checked in.
                            <button id="undo-checkin-button" class="mt-2 w-full bg-red-500 text-white p-2 rounded text-sm hover:bg-red-600 transition">
                                Undo Check-In
                            </button>
                        </div>
                        
                        <button
                            id="check-in-button"
                            class="w-full bg-blue-500 text-white p-4 rounded-lg font-medium hover:bg-blue-600 transition btn-large"
                        >
                            Confirm Check-In
                        </button>
                    </div>
                    
                    <button
                        id="back-button"
                        class="w-full border border-gray-300 text-gray-700 p-4 rounded hover:bg-gray-50 btn-large"
                    >
                        Back to Search
                    </button>
                </div>
                
                <!-- Error message -->
                <div id="error-container" style="display: none;">
                    <div class="text-red-500 text-center mb-4" id="error-message"></div>
                    <button 
                        id="try-again-button"
                        class="w-full bg-blue-500 text-white p-4 rounded hover:bg-blue-600 btn-large"
                    >
                        Try Again
                    </button>
                </div>
                
                <!-- Success message -->
                <div id="success-message" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-10" style="display: none;">
                    <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full text-center fade-in">
                        <div class="mb-4 mx-auto w-16 h-16 bg-green-100 rounded-full flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-green-500" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                            </svg>
                        </div>
                        <h2 class="text-2xl font-bold text-gray-800 mb-2">Check-In Successful!</h2>
                        <p id="success-message-text" class="text-gray-600 mb-6"></p>
                        <button id="success-close-button" class="bg-blue-500 text-white py-3 px-6 rounded-lg font-medium hover:bg-blue-600 transition">
                            Close
                        </button>
                    </div>
                </div>
                
                <!-- Password prompt for undo -->
                <div id="password-prompt" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-20" style="display: none;">
                    <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full fade-in">
                        <h2 class="text-xl font-bold text-gray-800 mb-4">Enter Admin Password</h2>
                        <p class="text-gray-600 mb-4">This action requires admin authorization.</p>
                        <input 
                            type="password" 
                            id="admin-password"
                            placeholder="Password" 
                            class="w-full p-3 border border-gray-300 rounded-lg mb-4 focus:ring-blue-500 focus:border-blue-500"
                        >
                        <div class="flex gap-2">
                            <button id="password-cancel" class="flex-1 border border-gray-300 text-gray-700 py-2 px-4 rounded-lg hover:bg-gray-50">
                                Cancel
                            </button>
                            <button id="password-submit" class="flex-1 bg-blue-500 text-white py-2 px-4 rounded-lg hover:bg-blue-600">
                                Submit
                            </button>
                        </div>
                        <p id="password-error" class="text-red-500 text-sm mt-2" style="display: none;">Incorrect password. Please try again.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION
        const API_URL = 'https://script.google.com/macros/s/AKfycbxJM91HN0OYJith17AKArCAHJ3t3ZqDEEYQOGIWUd9LaCVr5tK1O10K1fUOmW4ZHZbrtQ/exec';
        const ADMIN_PASSWORD = 'admin123'; // CHANGE THIS TO YOUR SECURE PASSWORD
        
        // App state
        let guests = [];
        let selectedGuest = null;
        let autoResetTimer = null;
        
        // DOM elements
        const loadingOverlay = document.getElementById('loading-overlay');
        const searchContainer = document.getElementById('search-container');
        const resultsContainer = document.getElementById('results-container');
        const noResults = document.getElementById('no-results');
        const guestDetails = document.getElementById('guest-details');
        const guestName = document.getElementById('guest-name');
        const guestTable = document.getElementById('guest-table');
        const guestSeat = document.getElementById('guest-seat');
        const alreadyCheckedIn = document.getElementById('already-checked-in');
        const checkInButton = document.getElementById('check-in-button');
        const undoCheckinButton = document.getElementById('undo-checkin-button');
        const backButton = document.getElementById('back-button');
        const errorContainer = document.getElementById('error-container');
        const errorMessage = document.getElementById('error-message');
        const tryAgainButton = document.getElementById('try-again-button');
        const searchInput = document.getElementById('search-input');
        const successMessage = document.getElementById('success-message');
        const successMessageText = document.getElementById('success-message-text');
        const successCloseButton = document.getElementById('success-close-button');
        const passwordPrompt = document.getElementById('password-prompt');
        const adminPasswordInput = document.getElementById('admin-password');
        const passwordCancel = document.getElementById('password-cancel');
        const passwordSubmit = document.getElementById('password-submit');
        const passwordError = document.getElementById('password-error');
        
        // Fetch guest list on load
        window.addEventListener('DOMContentLoaded', fetchGuestList);
        
        // Event listeners
        searchInput.addEventListener('input', handleSearch);
        checkInButton.addEventListener('click', handleCheckIn);
        undoCheckinButton.addEventListener('click', promptForPassword);
        backButton.addEventListener('click', resetSelection);
        tryAgainButton.addEventListener('click', () => {
            errorContainer.style.display = 'none';
            fetchGuestList();
        });
        successCloseButton.addEventListener('click', () => {
            clearAutoResetTimer();
            hideSuccessMessage();
            resetSelection();
        });
        passwordCancel.addEventListener('click', () => {
            passwordPrompt.style.display = 'none';
            adminPasswordInput.value = '';
            passwordError.style.display = 'none';
        });
        passwordSubmit.addEventListener('click', handlePasswordSubmit);
        adminPasswordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handlePasswordSubmit();
        });
        
        // Fetch guest list from API
        async function fetchGuestList() {
            showLoading();
            try {
                console.log("Fetching guests from:", `${API_URL}?action=getGuests`);
                const response = await fetch(`${API_URL}?action=getGuests`);
                console.log("Response status:", response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                
                const responseText = await response.text();
                console.log("Response text:", responseText);
                
                const data = JSON.parse(responseText);
                console.log("Parsed data:", data);
                
                if (Array.isArray(data)) {
                    guests = data;
                    hideLoading();
                    showSearch();
                } else {
                    throw new Error("Data is not an array");
                }
            } catch (err) {
                console.error("Fetch error:", err);
                hideLoading();
                showError('Failed to load guest list. Please check your connection and try again.');
            }
        }
        
        // Handle search input
        function handleSearch(e) {
            const searchTerm = e.target.value.toLowerCase();
            
            if (searchTerm) {
                const filtered = guests.filter(guest => 
                    guest.name.toLowerCase().includes(searchTerm)
                );
                
                if (filtered.length > 0) {
                    displayResults(filtered);
                } else {
                    resultsContainer.style.display = 'none';
                    noResults.style.display = 'block';
                }
            } else {
                resultsContainer.style.display = 'none';
                noResults.style.display = 'none';
            }
        }
        
        // Display filtered results
        function displayResults(filteredGuests) {
            resultsContainer.innerHTML = '';
            noResults.style.display = 'none';
            
            filteredGuests.forEach(guest => {
                const div = document.createElement('div');
                div.className = 'p-4 border-b last:border-b-0 hover:bg-gray-50 cursor-pointer flex justify-between items-center';
                
                const nameSpan = document.createElement('span');
                nameSpan.className = 'text-lg';
                nameSpan.textContent = guest.name;
                div.appendChild(nameSpan);
                
                if (guest.checkedIn) {
                    const checkedInBadge = document.createElement('span');
                    checkedInBadge.className = 'bg-green-100 text-green-800 text-xs px-2 py-1 rounded';
                    checkedInBadge.textContent = 'Checked In';
                    div.appendChild(checkedInBadge);
                }
                
                div.addEventListener('click', () => handleSelectGuest(guest));
                resultsContainer.appendChild(div);
            });
            
            resultsContainer.style.display = 'block';
        }
        
        // Handle guest selection
        function handleSelectGuest(guest) {
            selectedGuest = guest;
            guestName.textContent = guest.name;
            guestTable.textContent = guest.table;
            guestSeat.textContent = guest.seat;
            
            if (guest.checkedIn) {
                alreadyCheckedIn.style.display = 'block';
                checkInButton.style.display = 'none';
            } else {
                alreadyCheckedIn.style.display = 'none';
                checkInButton.style.display = 'block';
            }
            
            searchContainer.style.display = 'none';
            guestDetails.style.display = 'block';
            searchInput.value = '';
        }
        
        // Handle check-in
        async function handleCheckIn() {
            showLoading();
            try {
                console.log(`Calling API: ${API_URL}?action=checkIn&id=${selectedGuest.id}`);
                const response = await fetch(`${API_URL}?action=checkIn&id=${selectedGuest.id}`);
                const data = await response.json();
                
                console.log("Check-in response:", data);
                hideLoading();
                
                if (data.success) {
                    // Update local state
                    selectedGuest.checkedIn = true;
                    const index = guests.findIndex(g => g.id === selectedGuest.id);
                    if (index !== -1) {
                        guests[index].checkedIn = true;
                    }
                    
                    // Show success message
                    showSuccessMessage(`${selectedGuest.name} has been checked in successfully!`);
                } else {
                    showError('Failed to check in. Please try again.');
                }
            } catch (err) {
                console.error("Check-in error:", err);
                hideLoading();
                showError('Failed to check in. Please try again.');
            }
        }
        
        // Prompt for password
        function promptForPassword() {
            passwordPrompt.style.display = 'flex';
            adminPasswordInput.focus();
        }
        
        // Handle password submission
        function handlePasswordSubmit() {
            const password = adminPasswordInput.value;
            
            if (password === ADMIN_PASSWORD) {
                passwordPrompt.style.display = 'none';
                adminPasswordInput.value = '';
                passwordError.style.display = 'none';
                handleUndoCheckIn();
            } else {
                passwordError.style.display = 'block';
                adminPasswordInput.value = '';
                adminPasswordInput.focus();
            }
        }
        
        // Handle undo check-in
        async function handleUndoCheckIn() {
            showLoading();
            try {
                console.log(`Calling API: ${API_URL}?action=undoCheckIn&id=${selectedGuest.id}`);
                const response = await fetch(`${API_URL}?action=undoCheckIn&id=${selectedGuest.id}`);
                const responseText = await response.text();
                console.log("Undo response text:", responseText);
                
                const data = JSON.parse(responseText);
                console.log("Undo response data:", data);
                
                hideLoading();
                
                if (data.success) {
                    // Update local state
                    selectedGuest.checkedIn = false;
                    const index = guests.findIndex(g => g.id === selectedGuest.id);
                    if (index !== -1) {
                        guests[index].checkedIn = false;
                    }
                    
                    // Update UI
                    alreadyCheckedIn.style.display = 'none';
                    checkInButton.style.display = 'block';
                    
                    // Show brief confirmation
                    alert(`Check-in cancelled for ${selectedGuest.name}`);
                } else {
                    showError(`Failed to undo check-in. ${data.error || 'Please try again.'}`);
                }
            } catch (err) {
                console.error("Undo check-in error:", err);
                hideLoading();
                showError('Failed to undo check-in. Error: ' + err.message);
            }
        }
        
        // Show success message
        function showSuccessMessage(message) {
            successMessageText.textContent = message;
            successMessage.style.display = 'flex';
            
            // Automatically hide and reset after 5 seconds
            autoResetTimer = setTimeout(() => {
                hideSuccessMessage();
                resetSelection();
            }, 5000);
        }
        
        // Hide success message
        function hideSuccessMessage() {
            successMessage.style.display = 'none';
        }
        
        // Clear auto-reset timer
        function clearAutoResetTimer() {
            if (autoResetTimer) {
                clearTimeout(autoResetTimer);
                autoResetTimer = null;
            }
        }
        
        // Reset selection
        function resetSelection() {
            selectedGuest = null;
            guestDetails.style.display = 'none';
            searchContainer.style.display = 'block';
            searchInput.value = '';
            searchInput.focus();
        }
        
        // Show loading
        function showLoading() {
            loadingOverlay.style.display = 'flex';
        }
        
        // Hide loading
        function hideLoading() {
            loadingOverlay.style.display = 'none';
        }
        
        // Show search
        function showSearch() {
            searchContainer.style.display = 'block';
            searchInput.focus();
        }
        
        // Show error
        function showError(message) {
            hideLoading();
            searchContainer.style.display = 'none';
            guestDetails.style.display = 'none';
            errorMessage.textContent = message;
            errorContainer.style.display = 'block';
        }
    </script>
</body>
</html>
